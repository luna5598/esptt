<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MO伴 · 传感器课</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5ed;color:#233b36;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}
main{max-width:840px;margin:auto;padding:24px 18px}h1,h2,p{margin:0 0 12px}h1{font-size:32px}h2{font-size:20px}
section{border:1px solid #cdd8cc;border-radius:12px;padding:20px;background:#fffef9;margin:14px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #dce3d8;padding:10px 0}
small,#network{color:#4e655a}button,select{font:inherit;border:1px solid #76998a;border-radius:6px;padding:6px 12px}
button{background:#235c4c;color:white}button:disabled{opacity:.45}#samples{overflow-wrap:anywhere}progress{accent-color:#28674f;width:100%}
</style>
<main><h1>MO伴传感器课</h1><p id="network" role="status">正在连接设备</p>
<section><h2>四肢槽位</h2><div id="slots"></div></section>
<section><h2 id="lesson-title">温度记录</h2><p id="range-rule" hidden>将目标保持在 60–120 mm 内半秒，可暂停或继续计时。移到 180 mm 以外后可再次触发。</p>
<p id="phase">等待设备</p><progress id="progress" value="0" max="10"></progress>
<p id="timer" hidden></p><p id="samples"></p><label>采样位置 <select id="target"></select></label> <button id="action" disabled>开始记录</button>
<button id="stop" hidden>停止记录</button><p id="result" role="status"></p></section>
<section id="agent" hidden><h2>温湿度问答</h2><form id="askform">
<label>问 MO伴 <input id="question" maxlength="128" required placeholder="左手现在多少度？"></label>
<button id="askbutton">提问</button></form><p id="answer" role="status"></p></section></main>
<script>
const el=id=>document.getElementById(id);
const links={offline:'节点离线',empty:'未插配件',pending:'识别中',unsupported:'当前课程不支持此配件',foreign_binding:'节点会话不匹配，请复位该槽',bad_frame:'帧校验或身份错误',link_fault:'总线或节点故障',invalid_sample:'样本无效',unchanged:'等待新样本',sample:'已采样'};
const phases={idle:'待开始',running:'采样中',waiting:'配件已离开，等待确认',done:'已完成',stopped:'已停止'};
const reasons=['成功','槽位无效','设备已重启','配件已更换','槽位为空','没有新鲜读数','课程已改变','当前步骤无法执行','超出范围','配件类型与课程不匹配'];
let state=null,online=false,busy=false;
['左手','右手','左脚','右脚'].forEach((name,i)=>{
  el('target').add(new Option(name,i));const row=document.createElement('div');row.className='row';
  const label=document.createElement('b'),value=document.createElement('small');label.textContent=name;
  row.append(label,value);el('slots').append(row);
});
function render(){
  if(!state)return;
  el('agent').hidden=!state.agent_enabled;
  const {course:c,slots}=state;
  slots.forEach((s,i)=>{
    const freshValue=s.tip===2 ? s.distance_mm+' mm'
      : (s.temp_centi/100).toFixed(2)+' °C　'+(s.humidity_centi/100).toFixed(1)+' %RH';
    const stale=s.present&&(s.temp_centi!==null||s.distance_mm!==null);
    el('slots').children[i].lastChild.textContent=s.fresh ? freshValue : stale?'读数已过期':links[s.status];
  });
  const i=Number(el('target').value), waiting=c.phase==='waiting', active=waiting||c.phase==='running';
  const range=(c.run ? c.tip : slots[i].tip)===2;
  el('lesson-title').textContent=range?'免触专注计时':'温度记录';
  el('range-rule').hidden=!range;
  el('progress').hidden=range;
  el('timer').hidden=!range||!c.run;
  el('timer').textContent=(c.phase==='running'?(c.timer_paused?'计时暂停':'正在计时'):'累计用时')
    +'　'+(c.elapsed_ms/1000).toFixed(1)+' 秒';
  el('phase').textContent=phases[c.phase]+'　'+(range?'触发 '+c.events+' 次':c.samples.length+' / '+c.goal);
  el('samples').textContent=c.samples.map(s=>c.tip===2
    ? (s.ms/1000).toFixed(1)+' s · '+s.distance_mm+' mm' : (s.temp_centi/100).toFixed(2)+' °C').join('　');
  el('progress').value=c.samples.length;
  el('action').textContent=waiting?'确认新模块并继续':slots[i].tip===2?'开始测距':'开始记录';
  el('action').disabled=busy||!online||!slots[i].fresh||c.phase==='running'||(waiting&&(i!==c.slot||slots[i].tip!==c.tip));
  el('stop').hidden=!active;
  el('stop').disabled=busy||!online;

}
async function refresh(){
  try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error();state=await r.json();online=true;
    el('network').textContent=state.bus_ready?'设备已连接':'设备已连接，四肢总线尚未启用';}
  catch{online=false;el('network').textContent='设备连接中断';}
  render();
}
el('askform').onsubmit=async event=>{
  event.preventDefault();
  const question=el('question').value.trim();
  if(!question||el('askbutton').disabled)return;
  el('askbutton').disabled=true;
  el('answer').textContent='正在查询设备…';
  try{
    const r=await fetch('/api/ask',{method:'POST',headers:{'X-MOBan-UI':'1'},body:question});
    el('answer').textContent=await r.text();
  }catch{el('answer').textContent='设备连接中断';}
  finally{el('askbutton').disabled=false;}
};
el('target').onchange=render;
async function courseAction(action,i){
  if(busy||!state||!online)return;
  busy=true;render();
  const q=new URLSearchParams({boot:state.boot,slot:i,gen:state.slots[i].generation,run:state.course.run,action});
  try{const r=await fetch('/api/action?'+q,{method:'POST',headers:{'X-MOBan-UI':'1'}});
    const body=await r.json();el('result').textContent=r.ok?'已接受':(reasons[body.error]||'请求失败');}
  catch{el('result').textContent='连接失败，请刷新确认课程状态';}
  finally{await refresh();busy=false;render();}
}
el('action').onclick=()=>{
  const i=Number(el('target').value);
  courseAction(state.course.phase==='waiting'?3:state.slots[i].tip===2?2:1,i);
};
el('stop').onclick=()=>courseAction(4,state.course.slot);
(async function poll(){await refresh();setTimeout(poll,1000);})();
</script></html>
